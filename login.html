<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeGlow – Log in</title><link rel="stylesheet" href="cssforlogin.css"></head>
<body><div class="auth"><div class="auth-card">
<div class="brand">LifeGlow</div>
<p class="sub">Plan your day, build healthy habits, and glow.</p>
<div class="tabs"><button class="on" data-mode="login">Log in</button><button data-mode="register">Sign up</button></div>
<form id="authForm">
 <div id="nameBox" class="hide"><label for="full_name">Full name</label><input id="full_name" autocomplete="name"></div>
 <label for="email">Email</label><input id="email" type="email" required autocomplete="email">
 <label for="password">Password</label><input id="password" type="password" minlength="8" required autocomplete="current-password">
 <button class="btn" id="authBtn" type="submit">Log in</button>
 <div class="msg" id="msg"></div>
</form></div></div>
<script src="script.js"></script></body></html>
